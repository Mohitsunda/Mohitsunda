name: Portfolio quality
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
      - name: Build offline demo
        run: portfolio build --source demo
      - name: Test contracts, decisions and app
        run: pytest -q
      - name: Execute project notebooks
        run: python scripts/execute_notebooks.py
