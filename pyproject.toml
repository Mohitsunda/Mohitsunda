[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mohit-analytics-portfolio"
version = "1.0.0"
description = "Reproducible retail, retention and logistics decision projects"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Mohit Sunda"}]
dependencies = [
  "pandas==2.2.3", "numpy==2.3.5", "scikit-learn==1.8.0",
  "duckdb==1.5.6", "openpyxl==3.1.5", "pyarrow==26.0.1",
  "streamlit==1.67.0", "plotly==6.9.0", "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]

[project.scripts]
portfolio = "portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio = ["queries/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
